version: 1
name: broken-leak
services:
  db:
    command: python3 db.py
    directory: connection-leak
    ports: [5434]
    health: { type: tcp, port: 5434 }
  api:
    command: python3 api.py
    directory: connection-leak
    depends_on:
      db: { condition: healthy }
    ports: [3009]
    health: { type: http, url: http://127.0.0.1:3009/ }
