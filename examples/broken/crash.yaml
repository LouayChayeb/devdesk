version: 1
name: broken-crash
services:
  db:
    # Quoted: a ": " inside an unquoted YAML value is not allowed.
    command: 'python3 -c "import sys; print(''connecting to the database...'', flush=True); sys.exit(''FATAL: password authentication failed for user app'')"'
    health: { type: tcp, port: 3009 }
  api:
    command: python3 -m http.server 3007 --bind 127.0.0.1
    depends_on:
      db: { condition: healthy }   # so api waits, and is blocked when db fails
