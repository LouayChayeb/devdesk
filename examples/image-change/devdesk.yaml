# An image change that breaks the stack, and DevDesk proving it. Needs Docker.
#
#   1. docker build -t devdesk-example/greeter:latest v1      (greeter 1.0)
#   2. devdesk trust && devdesk up                           (all healthy: DevDesk remembers this clean start)
#      Ctrl+C
#   3. docker build -t devdesk-example/greeter:latest v2      (same tag, new image: like a `docker pull` of :latest)
#   4. devdesk up                                            (greeter never becomes healthy, client is blocked)
#      Ctrl+C
#   5. devdesk why             → "LIKELY image devdesk-example/greeter:latest", ranked first
#      devdesk why --prove     → "PROVEN": the old image passes the same health check, the new one fails.
#                                The replay runs in throwaway containers on random ports; nothing of yours is touched.
#   Clean up: docker image rm devdesk-example/greeter:latest
version: 1
name: image-change

services:
  greeter:
    container:
      image: devdesk-example/greeter:latest
      ports: ["58080:8080"]
    health: { type: http, url: http://127.0.0.1:58080/, start_period: 10s }

  client:
    command: sh -c 'while true; do sleep 5; done'
    depends_on:
      greeter: { condition: healthy }
