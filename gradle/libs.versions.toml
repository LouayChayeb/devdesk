# Version catalog: the single place where dependency versions live.
# Build scripts refer to entries as libs.<alias>, e.g. libs.assertj.core (dashes become dots).
# Only what M0 needs is listed; each later milestone adds its own libraries.

[versions]
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.10.3"
# Tool versions read by the convention plugin (not libraries our code uses):
palantir = "2.100.0"
checkstyle = "14.3.0"

[libraries]
# The BOM (bill of materials) pins every JUnit artifact to the same version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Gradle plugins used by build-logic (the shared rules), not by DevDesk code.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
