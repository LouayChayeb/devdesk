# Version catalog: the single place where dependency versions live.
# Build scripts refer to entries as libs.<alias>, e.g. libs.assertj.core (dashes become dots).
# Only what M0 needs is listed; each later milestone adds its own libraries.

[versions]
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.10.3"
picocli = "4.7.7"
jackson = "3.2.3"
javalin = "7.2.3"
docker-java = "3.7.1"
# Must match the SLF4J 1.7 API that docker-java uses.
slf4j = "1.7.36"
# Javalin uses SLF4J 2, whose backends are found differently, so the daemon needs a 2.x backend.
slf4j2 = "2.0.18"
# Tool versions read by the convention plugin (not libraries our code uses):
palantir = "2.100.0"
checkstyle = "14.3.0"

[libraries]
# The BOM (bill of materials) pins every JUnit artifact to the same version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "docker-java" }
docker-java-httpclient5 = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "docker-java" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
slf4j2-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j2" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

# Gradle plugins used by build-logic (the shared rules), not by DevDesk code.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
