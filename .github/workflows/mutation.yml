# Mutation testing: PIT changes the product code in small ways (flips a condition, drops a call, returns empty)
# and reruns the tests. A change no test notices is a gap in the tests. Too slow for every push, so it runs
# every night and on demand (Actions tab → mutation → Run workflow). It reports; it doesn't fail the build.
name: mutation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        module: [engine-core, engine-linux, engine-docker, engine-data, daemon]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      # The same setup as the build job: some tests need zsh and a systemd user session.
      - name: Give the tests zsh and a systemd user session
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zsh
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

      - run: ./gradlew :${{ matrix.module }}:pitest

      - name: Score
        run: |
          score=$(python3 scripts/mutation-score.py ${{ matrix.module }}/build/reports/pitest/mutations.xml)
          echo "${{ matrix.module }}: $score"
          echo "**${{ matrix.module }}** mutation score (product code): $score" >> "$GITHUB_STEP_SUMMARY"

      # The score is already in the job summary; the full report is a nice-to-have. Kept 1 day so nightly reports
      # don't fill the artifact quota, and a full quota no longer turns the whole run red.
      - uses: actions/upload-artifact@v5
        if: always()
        continue-on-error: true
        with:
          name: pitest-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest
          retention-days: 1
